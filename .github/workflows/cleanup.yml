name: Cleanup Empty Diary Pages

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真正归档（不勾选则只预览）"
        required: false
        default: false
        type: boolean

jobs:
  cleanup:
    name: Cleanup Empty Pages
    runs-on: ubuntu-latest
    env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cleanup
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python -u scripts/cleanup_empty.py --apply
          else
            python -u scripts/cleanup_empty.py
          fi
